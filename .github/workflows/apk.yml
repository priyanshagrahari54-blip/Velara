name: apk

# VELARA Android build — cloud mein APK banke GitHub Release par upload hota hai.
# Download (phone par kholo): https://github.com/priyanshagrahari54-blip/Velara/releases/tag/android-latest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'tools/IconGen.java', '.github/workflows/apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps (browsers skip — CI mein playwright nahi chahiye)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Setup Capacitor (Android 6, Java 17)
        run: |
          npm i -D @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.priyansh.velara","appName":"VELARA","webDir":"dist","android":{"backgroundColor":"#0b0d10"}}' > capacitor.config.json
          npx cap add android

      - name: Landscape lock + classic icons
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="sensorLandscape"|' "$MANIFEST"
          # adaptive-xml hatao — humare classic PNG icons har density par use honge
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Generate launcher icons (PRIYANSH monogram)
        run: java tools/IconGen.java android/app/src/main/res

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK (installable, debug-signed)
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VELARA-android.apk
          ls -la VELARA-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VELARA-android-apk
          path: VELARA-android.apk

      - name: Publish to public release (android-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest VELARA-android.apk \
            --title "VELARA — Android APK (latest)" \
            --notes "Overcast Moody update — AAA-realistic look, driving touch controls, PRIYANSH branding.

          Phone par install: APK download karo → open karo → 'Install from unknown sources' allow karo. (Android 8+ ke liye; ye build Android 5.1+ support karti hai.)"
