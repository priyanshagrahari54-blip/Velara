name: UE Team

# ---------------------------------------------------------------------------
# VELARA Unreal track ka build team (v0.7):
#   1. preflight   — har push: ue5/ scaffold sanity (files, python, JSON)
#   2. cook-hosted — MANUAL only: Epic ka official dev-container try karta hai
#                    (secret EPIC_GHCR_TOKEN chahiye — free GHCR token)
#   3. build-pc    — Priyansh ke PC par self-hosted runner (runs-on:
#                    [self-hosted, unreal]) — unlimited minutes, full APK+exe.
#                    Setup: README-UE.md section "Apna PC build-server banao".
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths: ['ue5/**', 'factory/out/**']
  workflow_dispatch:
    inputs:
      target:
        description: 'android | win64 | both'
        required: false
        default: 'android'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: UE scaffold sanity
        run: |
          set -e
          for f in ue5/VelaraUE.uproject ue5/Config/DefaultEngine.ini \
                   ue5/Source/VelaraUE/VelaraUE.Build.cs \
                   ue5/Content/Python/setup_assets.py \
                   ue5/Content/Data/city_layout.json; do
            [ -f "$f" ] && echo "OK $f" || { echo "MISSING $f"; exit 1; }
          done
          python3 - <<'PY'
          import json
          j = json.load(open('ue5/Content/Data/city_layout.json'))
          b, p = len(j['buildings']), len(j['props'])
          assert b > 50 and p > 100, "layout thin?"
          print(f"layout OK: {b} buildings, {p} props")
          import py_compile
          py_compile.compile('ue5/Content/Python/setup_assets.py', doraise=True)
          py_compile.compile('factory/jobs/gen-city-layout.py', doraise=True)
          print("python OK")
          PY
          echo "PREFLIGHT PASS"

  # ---- hosted Epic container (experimental, secret-gated) -----------------
  cook-hosted:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # fragile — PC-runner primary hai
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: sec
        run: |
          if [ -n "${{ secrets.EPIC_GHCR_TOKEN }}" ]; then echo "have=yes"; else echo "have=no"; fi
      - name: Try Epic dev-container cook
        if: steps.sec.outputs.have == 'yes'
        run: |
          echo "Epic dev-container Android cook — experimental track"
          echo "docker run ghcr.io/epicgames/unreal-engine:dev-5.5.x ..."
          # Placeholder: jab token ho, yahan full cook command aayega
          # (SceneForge-UE5-Lab pattern — engine pull + cook + upload artifact)
          echo "abhi skip — README-UE.md dekho"

  # ---- Priyansh ke PC par (primary build server) ---------------------------
  build-pc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, unreal]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: [android]
    steps:
      - uses: actions/checkout@v4
      - name: Package ${{ matrix.target }}
        shell: pwsh
        run: |
          # UE install path yahan adjust karo (default: C:\Program Files\Epic Games\UE_5.5)
          $UE = "C:\Program Files\Epic Games\UE_5.5"
          $UAT = "$UE\Engine\Build\BatchFiles\RunUAT.bat"
          & $UAT BuildCookRun `
            -project="$PWD\ue5\VelaraUE.uproject" `
            -noP4 -platform=${{ matrix.target }} -clientconfig=Development `
            -cook -stage -package -pak -archive `
            -archivedirectory="$PWD\Build\${{ matrix.target }}" `
            -build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          echo "PACKAGED -> Build/${{ matrix.target }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VelaraUE-${{ matrix.target }}
          path: Build/${{ matrix.target }}/**/*.apk
          if-no-files-found: warn
